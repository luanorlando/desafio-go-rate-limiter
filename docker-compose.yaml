services:
  redis:
    image: redis:alpine
    container_name: redis_rate_limiter
    ports:
      - "6379:6379"
    networks:
      - rate-limiter-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: app_rate_limiter
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_ADDR=redis:6379
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rate-limiter-net

networks:
  rate-limiter-net:
    driver: bridge